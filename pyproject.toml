[project]
name = "spritestack-pixelgen"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pillow", "torch>=2.1", "diffusers", "transformers", "accelerate", "peft"]

[project.optional-dependencies]
dev = ["pytest"]
server = ["fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
